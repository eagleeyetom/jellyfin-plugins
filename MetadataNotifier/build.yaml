    type: Icon
changelog: |
  ## v1.2.0.0
  - Add transcode reasons display (e.g. Audio codec or subtitles incompatible)
  - Add live toast notification when viewer switches audio track mid-playback
  - Add audio conversion visualization (Source ➔ Target codec and channels)
  - Add multilayer HDR10+ detection (Jellyfin probe, stream tags, filename)
  - Fix Dolby Vision fallback on Samsung TVs (Profile 7/8 automatically maps to HDR10/HDR10+)
  - Add custom notification format template option
  - Add library and user exclusion lists
  - Add option to ignore music and audio-only playback
  - Fix active audio stream selection for multi-audio media
  - Improve container bitrate calculation accuracy
  ## v1.1.0.1
  - Fix plugin discovery by excluding Jellyfin framework assemblies from the release package
  ## v1.1.0.0
  - Restore the Settings button on the plugin card
  ## v1.0.1.2
  - Fix configuration page routing in Jellyfin dashboard (remove space in page name)
  ## v1.0.1.1
  - Add main menu sidebar integration under Extensions for easy configuration access
  - Fix technical audio names (Atmos / DTS:X base codec details)
  ## v1.0.1.0
  - Rename plugin to Metadata Notifier (formerly Samsung Metadata Notifier)
  - Add SDR support detection
  - Add option to select toast notification duration
  - Cleanup and optimize configuration UI
  ## v1.0.0.0
  - Initial release: Send on-screen toast notifications with HDR metadata (HDR10+, Dolby Vision, HDR10), audio codecs, and transcoding status for Samsung TVs (Tizen) and other clients.

