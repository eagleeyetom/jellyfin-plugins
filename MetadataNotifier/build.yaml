targetAbi: 12.0.0.0
owner: eagleeyetom
category: General
artifacts:
  - path: Jellyfin.Plugin.MetadataNotifier/bin/Release/net10.0/Jellyfin.Plugin.MetadataNotifier.dll
    type: Assembly
  - path: Jellyfin.Plugin.MetadataNotifier/MetadataNotifier.png
    type: Icon
changelog: |
  ## v1.3.1.0
  - Fix culture-sensitive bitrate formatting (prevent comma separator on non-English locales)
  - Prevent false-positive Dolby Vision detection on DVD and DVB stream titles
  - Support Android TV and Google TV client detection for Dolby Vision
  - Make startup delay immediately bypass polling when configured to zero
  - Cancel pending startup toasts when playback stops or is superseded during the delay
  - Ensure audio track switch notifications trigger even when audio index initializes after start
  - Expand audio channel layout mapping (5.0, 7.0, 2.1, 3.1, 4.0) and transcode reason labels
  - Fix config page preview separator cleanup and hyphenated codec preservation
  ## v1.3.0.0
  - Add optional tone-mapped SDR detection using Jellyfin transcode reasons
  - Improve mono PCM, Direct Stream, custom template, and audio track reporting
  - Use the selected media version for HDR, audio, and bitrate metadata
  - Replace fixed startup delay with bounded session polling and cancellable handlers
  - Add debug diagnostics and unit coverage for metadata formatting
  ## v1.2.1.0
  - Upgrade plugin target framework to .NET 10 and Jellyfin 12 packages
  ## v1.2.0.0
  - Add transcode reasons display (e.g. Audio codec or subtitles incompatible)
  - Add live toast notification when viewer switches audio track mid-playback
  - Add audio conversion visualization (Source ➔ Target codec and channels)
  - Add multilayer HDR10+ detection (Jellyfin probe, stream tags, filename)
  - Fix Dolby Vision fallback on Samsung TVs (Profile 7/8 automatically maps to HDR10/HDR10+)
  - Add custom notification format template option
  - Add library and user exclusion lists
  - Add option to ignore music and audio-only playback
  - Fix active audio stream selection for multi-audio media
  - Improve container bitrate calculation accuracy
  ## v1.1.0.1
  - Fix plugin discovery by excluding Jellyfin framework assemblies from the release package
  ## v1.1.0.0
  - Restore the Settings button on the plugin card
  ## v1.0.1.2
  - Fix configuration page routing in Jellyfin dashboard (remove space in page name)
  ## v1.0.1.1
  - Add main menu sidebar integration under Extensions for easy configuration access
  - Fix technical audio names (Atmos / DTS:X base codec details)
  ## v1.0.1.0
  - Rename plugin to Metadata Notifier (formerly Samsung Metadata Notifier)
  - Add SDR support detection
  - Add option to select toast notification duration
  - Cleanup and optimize configuration UI
  ## v1.0.0.0
  - Initial release: Send on-screen toast notifications with HDR metadata (HDR10+, Dolby Vision, HDR10), audio codecs, and transcoding status for Samsung TVs (Tizen) and other clients.

