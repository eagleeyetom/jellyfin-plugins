<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Flat icon: a subtitle line lifted from the bottom of the screen to the top. -->
  <rect x="32" y="32" width="960" height="960" rx="200" fill="#101a33"/>

  <!-- screen and stand -->
  <rect x="152" y="210" width="720" height="470" rx="48" fill="#00a4dc"/>
  <rect x="186" y="244" width="652" height="402" rx="22" fill="#0b3f8f"/>
  <rect x="452" y="680" width="120" height="70" fill="#00a4dc"/>
  <rect x="352" y="742" width="320" height="44" rx="22" fill="#00a4dc"/>

  <!-- subtitle at the top (where {\an8} puts it) -->
  <rect x="262" y="300" width="290" height="56" rx="28" fill="#ffd60a"/>
  <rect x="578" y="300" width="184" height="56" rx="28" fill="#ffd60a"/>

  <!-- original position at the bottom -->
  <rect x="262" y="560" width="290" height="40" rx="20" fill="none" stroke="#5b8bd6" stroke-width="10" stroke-dasharray="26 18"/>
  <rect x="578" y="560" width="184" height="40" rx="20" fill="none" stroke="#5b8bd6" stroke-width="10" stroke-dasharray="26 18"/>

  <!-- arrow up -->
  <rect x="490" y="420" width="44" height="118" rx="22" fill="#ffffff"/>
  <path d="M 512 380 L 584 452 L 440 452 Z" fill="#ffffff" stroke="#ffffff" stroke-width="16" stroke-linejoin="round"/>
</svg>
