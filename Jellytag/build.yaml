name: "JellyTag"
guid: "f4a2e8c1-9b3d-4f7a-b6c5-2d8e1a3f9b04"
version: "2.6.0.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
owner: "JellyTag"
overview: "Adds quality badges (4K, 1080p, etc.) to media posters and thumbnails."
description: |
  JellyTag automatically adds quality resolution badges to your media posters and thumbnails.
  Badges are visible on all clients including web, mobile, TV, and Kodi.

  Features:
  - Automatic quality detection based on video resolution
  - Configurable badge position (corners)
  - Configurable badge size
  - Image caching for performance
  - Support for 4K, 1080p, 720p, and SD badges
category: "General"
artifacts:
  - "Jellyfin.Plugin.JellyTag.dll"
changelog: |
  ## v2.6.0.0 (2026-10-05)
  - Overhaul configuration menu into 5 streamlined accordion sections with General settings first
  - Add global Badge Style selector (Image, Brand Logo, Text) and corner shape controls (Rectangular, Square, Round)
  - Compensate for client-side 2:3 card cropping on TVDB poster aspect ratios with safe-area calculations
  - Add custom badge colors section with category filters and search for per-element recoloring
  - Add option to use white background for brand logos
  - Add an optional combined Dolby Vision + Dolby Atmos brand logo using the official combined mark
  - Add cropped black-background and white-background logo variants and include the setting in image cache fingerprints
  - Redesign AAC logo to horizontal layout matching other audio badges with toggle for original square logo
  - Crop excess whitespace from H.264 logo badges and implement horizontal logo fitting
  - Add option to hide Dolby Vision badges on Fire TV clients (fallback to HDR10/HDR10+) with robust session, header, and IP-based client detection
  - Improve HDR10+ detection supporting Hdr10PlusPresentFlag and expanded filename patterns
  - Dual-key index raster cache and optimize badge caching performance
  ## v2.5.0.0 (2026-09-28)
  - Separate Audio Channel Badges (7.1, 5.1, Stereo, Mono) into a dedicated panel with independent positioning, styling, ordering, and badge selection
  - Allow displaying audio codec brand logos (e.g. Dolby Digital, DTS, Atmos) and channel numbers simultaneously without one hiding the other under ShowMode=Highest
  - Add official Brand Logos for FLAC, DTS, Dolby Digital (AC3), Dolby Digital+ (EAC3), AAC, and MPEG-2
  - Add per-badge brand logo toggles in web configuration UI to customize which formats use logos vs standard badges
  - Add audio and video codec detection for AC3, EAC3, DTS, FLAC, AAC, VC-1, and MPEG-2
  - Fix CSS selector escaping for badge keys containing dots (e.g. 7.1, 5.1) in web configuration preview
  - Add automatic migration and backfilling of channel and audio badge settings for existing configurations
  - Add comprehensive automated unit test suite (64 tests) covering detection, scoring, migration, and caching
  ## v2.4.2.0 (2026-09-27)
  - Upgrade plugin target framework to .NET 10 and Jellyfin 12 packages
  ## v2.4.1.0 (2026-09-27)
  - Fix 401 error on settings export by using fetch with Authorization header and blob download
  - Fix series and season quality aggregation to select highest quality HDR and Audio tracks instead of first episode's badges
  - Increase item query limit for series to inspect up to 50 episodes
  - Improve Atmos and DTS:X detection to include stream Title and DisplayTitle for Web-DL (EAC3) compatibility
  - Support SMPTE ST 2094-40 metadata markers in video stream title/comment for HDR10+ detection
  - Adjust audio codec priority hierarchy so lossless (TrueHD, DTS-HD MA) and immersive (Atmos, DTS:X) tracks take precedence over lossy Opus
  - Respect ChannelLayout and exclude commentary/audio description tracks from primary badge selection
  - Fix excluded libraries GUID comparison to support both formatted and unformatted GUID strings
  - Include HideHdrOnWindowsClients in image cache fingerprint calculation
  - Fix resolution detection, implement full Opus audio codec support, update UI configuration, and improve brand logo generation for black backgrounds
  ## v2.4.0.0 (2026-09-26)
  - New "Brand Logo" badge style using real logos for Dolby Vision, Dolby Atmos, Dolby TrueHD,
    HDR10, HDR10+, DTS:X, DTS-HD MA, AV1, H.264 and VP9; badges without a logo keep the generated text art
  - Language flags are now configurable: pick the flag used for each language in the new
    Language Flags section, since most languages are spoken in several countries
  - Files tagged with a region such as pt-BR now use that region's flag automatically
  - Language codes are normalised, so a file carrying both "en" and "eng" audio no longer
    shows the same flag twice, and the Text badge style shows "EN" instead of "ENG"
  - Basque, Catalan and Galician now default to their own flags instead of the Spanish flag
  - Fix: changing the Icon Style (Rectangular/Square/Round) now invalidates cached images
  - Remove 17 duplicate PNG badge assets that were never used, shrinking the package by ~357 KB
  ## v2.2.0.0
  - Add option to hide HDR badges on Windows clients (SDR-only mode)
  - Windows client detection via User-Agent and X-Emby headers
  - Separate image caching for Windows SDR variants
  ## v2.1.0.3
  - Prevent broken-image icons in the custom badge gallery when a preview cannot be loaded
  ## v2.1.0.2
  - Remove combined DV+Atmos badge and fix custom badge previews for 5.1 and 7.1 keys
  ## v2.1.0.1
  - Fix: preserve badge order when combining DV+Atmos to prevent ShowMode=Highest from hiding combined badge
  ## v2.1.0.0
  - Add option to combine Dolby Vision + Atmos badges into single visual, matching TV manufacturer UI patterns. Respects existing Samsung client filtering.
  ## v2.0.5.0
  - Invalidate image caches when the plugin version changes to prevent stale client-specific badges
  ## v2.0.4.0
  - Improve Samsung/Tizen client detection and isolate client-specific image caches when hiding Dolby Vision badges
  ## v2.0.3.0
  - Add an option to hide Dolby Vision badges for Samsung clients while preserving HDR10+ badges
  ## v2.0.2.0
  - Fix: exclude SkiaSharp native assets that caused plugin loading crash, pin Jellyfin packages to 10.11.0 for full 10.11.x compatibility
  ## v2.0.1.0
  - Fix: support Jellyfin base URL configuration, fix resolution detection thresholds
  ## v2.0.0.0
  - v2: Multi-category badges (resolution, HDR, codec, audio, language, VOST), per-panel config, SVG rendering with SkiaSharp, custom badge upload, live preview, library filtering, config export/import
  ## v1.0.0.0
  - Initial release with quality detection, configurable badges, and image caching
